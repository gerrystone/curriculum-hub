services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: curriculum-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: curriculum_hub
      POSTGRES_USER: curriculum_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U curriculum_user -d curriculum_hub"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: